<style>
#openby-concept{--ob-bg:light-dark(#f7f7f9,#202124);--ob-side:light-dark(#eceef2,#292b30);--ob-surface:light-dark(#fff,#2b2d32);--ob-text:light-dark(#252833,#eff0f4);--ob-muted:light-dark(#656b78,#adb3c0);--ob-line:light-dark(#e1e3e8,#40434b);--ob-blue:light-dark(#1766d5,#75adff);--ob-selected:light-dark(#dbe7fa,#354967);--ob-green:light-dark(#217044,#81d6a1);--ob-primary:light-dark(#1766d5,#286bd2);font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ob-text);width:100%;}
#openby-concept *{box-sizing:border-box}#openby-concept button,#openby-concept input,#openby-concept select{font:inherit}#openby-concept button{cursor:pointer;color:var(--ob-text);background:var(--ob-surface);border:1px solid var(--ob-line);border-radius:6px;padding:5px 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}#openby-concept button:hover{filter:brightness(.96)}#openby-concept .ob-primary{background:var(--ob-primary);border-color:var(--ob-primary);color:#fff}#openby-concept .ob-quiet{background:transparent;border-color:transparent}#openby-concept .ob-window{background:var(--ob-bg);border:1px solid var(--ob-line);border-radius:12px;overflow:hidden;position:relative}#openby-concept .ob-chrome{height:44px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--ob-line);background:var(--ob-side)}#openby-concept .ob-lights{display:flex;gap:8px}#openby-concept .ob-lights span{width:11px;height:11px;border-radius:50%;background:light-dark(#c4c7cf,#747884)}#openby-concept .ob-brand{font-weight:600}#openby-concept .ob-draft{margin-left:auto;color:var(--ob-muted);font-size:11px}#openby-concept .ob-layout{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:550px}#openby-concept aside{background:var(--ob-side);padding:22px 10px 12px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--ob-line)}#openby-concept .ob-caption{font-size:11px;color:var(--ob-muted);padding:0 10px;margin:0 0 8px}#openby-concept .ob-type{width:100%;justify-content:flex-start;text-align:left;border:0;background:transparent;padding:10px;gap:10px;min-height:60px}#openby-concept .ob-type[aria-pressed=true]{background:var(--ob-selected)}#openby-concept .ob-type strong{display:block;font-weight:600}#openby-concept small{font-size:11px;color:var(--ob-muted);display:block}#openby-concept .ob-file{width:29px;height:34px;display:grid;place-items:center;background:var(--ob-surface);border:1px solid var(--ob-line);border-radius:5px;color:var(--ob-blue);flex-shrink:0}#openby-concept .ob-sidefooter{margin-top:auto;padding-top:44px;display:grid;gap:6px}#openby-concept main{padding:26px 24px;min-width:0}#openby-concept .ob-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:30px}#openby-concept .ob-heading{display:flex;align-items:center;gap:12px}#openby-concept .ob-heading .ob-file{width:40px;height:46px}#openby-concept h2{font-size:23px;line-height:1.25;letter-spacing:-.5px;margin:0 0 4px;font-weight:600}#openby-concept .ob-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#openby-concept .ob-green{color:var(--ob-green);font-size:12px}#openby-concept .ob-sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}#openby-concept h3{font-size:14px;font-weight:600;margin:0 0 3px}#openby-concept p{margin:0}#openby-concept .ob-hint{font-size:11px;color:var(--ob-muted)}#openby-concept .ob-group{background:var(--ob-surface);border:1px solid var(--ob-line);border-radius:10px;overflow:hidden}#openby-concept .ob-rule{display:grid;grid-template-columns:14px minmax(0,1fr) 12px minmax(80px,.65fr) auto;align-items:center;gap:10px;padding:17px 14px;min-height:79px}#openby-concept .ob-rule+.ob-rule{border-top:1px solid var(--ob-line)}#openby-concept .ob-rule strong{font-weight:500}#openby-concept .ob-folder{display:flex;gap:8px;align-items:center;margin-bottom:3px}#openby-concept .ob-folder svg{color:var(--ob-blue);flex-shrink:0}#openby-concept .ob-number{color:var(--ob-muted);font-size:11px}#openby-concept .ob-path{overflow-wrap:anywhere}#openby-concept .ob-app{display:flex;align-items:center;gap:7px;flex-wrap:wrap}#openby-concept .ob-fallback{margin-top:24px}#openby-concept .ob-fallbackrow{display:flex;align-items:center;gap:12px;padding:15px}#openby-concept .ob-fallbackrow>div{flex:1}#openby-concept .ob-preview{margin-top:24px;padding-top:18px;border-top:1px solid var(--ob-line)}#openby-concept .ob-result{margin-top:13px;background:var(--ob-selected);border-radius:8px;padding:12px;overflow-wrap:anywhere}#openby-concept .ob-result:empty{display:none}#openby-concept .ob-overlay{position:absolute;inset:44px 0 0;background:light-dark(#262c3c44,#0009);display:flex;justify-content:center;align-items:flex-start;padding:30px 16px;z-index:5}#openby-concept [hidden]{display:none!important}#openby-concept .ob-sheet{width:420px;max-width:100%;padding:24px;background:var(--ob-surface);border:1px solid var(--ob-line);border-radius:12px;box-shadow:0 15px 45px #0003}#openby-concept .ob-sheet h3{font-size:18px;margin-bottom:20px}#openby-concept .ob-field{display:grid;gap:6px;margin:16px 0}#openby-concept select{width:100%;padding:8px;background:var(--ob-bg);border:1px solid var(--ob-line);border-radius:6px;color:var(--ob-text)}#openby-concept .ob-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}#openby-concept .ob-empty{padding:28px 18px;text-align:center;color:var(--ob-muted)}
@media(max-width:600px){#openby-concept .ob-layout{grid-template-columns:1fr}#openby-concept aside{border-right:0;border-bottom:1px solid var(--ob-line);flex-direction:row;flex-wrap:wrap;padding:10px}#openby-concept .ob-caption{width:100%;margin:0}#openby-concept .ob-type{width:auto;flex:1;padding:8px}#openby-concept .ob-type small{display:none}#openby-concept .ob-sidefooter{padding:0;margin:0;width:100%;display:flex;justify-content:space-between}#openby-concept main{padding:22px 16px}#openby-concept .ob-rule{grid-template-columns:12px minmax(0,1fr) auto}#openby-concept .ob-rule>.ob-arrow{display:none}#openby-concept .ob-rule>.ob-app{grid-column:2}#openby-concept .ob-rule>button{grid-column:3;grid-row:1/3}#openby-concept .ob-sectionhead{flex-wrap:wrap}#openby-concept .ob-header{margin-bottom:24px}#openby-concept .ob-sheet{padding:20px}}
@media(pointer:coarse){#openby-concept button{min-height:44px}#openby-concept select{font-size:16px}}
</style>
<div id="openby-concept">
 <div class="ob-window">
  <div class="ob-chrome"><div class="ob-lights" aria-hidden="true"><span></span><span></span><span></span></div><span class="ob-brand">OpenBy</span><span class="ob-draft">设计草案 · 示例数据</span></div>
  <div class="ob-layout">
   <aside aria-label="文件类型">
    <p class="ob-caption">文件类型</p>
    <button class="ob-type" data-type="pdf" aria-pressed="true"><span class="ob-file"><i data-lucide="file-text" aria-hidden="true"></i></span><span><strong>PDF 文档</strong><small>2 条规则 · 已启用</small></span></button>
    <button class="ob-type" data-type="md" aria-pressed="false"><span class="ob-file"><i data-lucide="file-code" aria-hidden="true"></i></span><span><strong>Markdown</strong><small>1 条规则 · 已启用</small></span></button>
    <button class="ob-type" data-type="txt" aria-pressed="false"><span class="ob-file"><i data-lucide="file" aria-hidden="true"></i></span><span><strong>文本文件</strong><small>尚未启用</small></span></button>
    <div class="ob-sidefooter"><button class="ob-quiet" data-info="实际界面将通过选择示例文件识别文件类型。"><i data-lucide="plus" aria-hidden="true"></i>添加文件类型…</button><button class="ob-quiet" data-info="帮助与诊断将在独立窗口展示应用信息、状态检查和最近问题。"><i data-lucide="circle-help" aria-hidden="true"></i>帮助与诊断</button></div>
   </aside>
   <main>
    <div class="ob-header"><div class="ob-heading"><span class="ob-file"><i data-lucide="file-text" aria-hidden="true"></i></span><div><h2 id="ob-title">PDF 文档</h2><small id="ob-extension">.pdf</small></div></div><div class="ob-status"><span class="ob-green" id="ob-status">● 已启用</span><button id="ob-enable" hidden>启用自动打开</button><button class="ob-quiet" aria-label="文件类型更多操作" data-info="更多操作：停用并恢复原应用、移除文件类型。实际操作将显示恢复说明。"><i data-lucide="ellipsis" aria-hidden="true"></i></button></div></div>
    <section aria-label="位置规则"><div class="ob-sectionhead"><div><h3>位置规则</h3><p class="ob-hint">从上到下匹配，首条符合的规则生效</p></div><button class="ob-primary" id="ob-add"><i data-lucide="plus" aria-hidden="true"></i>添加规则</button></div><div class="ob-group" id="ob-rules"></div></section>
    <section class="ob-fallback" aria-label="其他位置"><div class="ob-sectionhead"><h3>其他位置</h3></div><div class="ob-group ob-fallbackrow"><i data-lucide="app-window" aria-hidden="true"></i><div><p id="ob-fallback">预览</p><small>没有规则匹配时，使用此应用</small></div><button data-info="实际界面将打开应用选择面板，更改其他位置使用的应用。">更改…</button></div></section>
    <section class="ob-preview" aria-label="预览打开结果"><div class="ob-sectionhead"><div><h3>预览打开结果</h3><p class="ob-hint">仅预览，不会打开文件</p></div><button id="ob-test"><i data-lucide="play" aria-hidden="true"></i>选择文件…</button></div><div class="ob-result" id="ob-result" aria-live="polite"></div></section>
   </main>
  </div>
  <div class="ob-overlay" id="ob-overlay" hidden><section class="ob-sheet" role="dialog" aria-modal="true" aria-labelledby="ob-sheet-title"><h3 id="ob-sheet-title">编辑位置规则</h3><label class="ob-field">文件所在文件夹<select id="ob-folder"><option>Papers</option><option>Work</option><option>Projects</option><option>Downloads</option></select></label><label><input type="checkbox" id="ob-descendants" checked> 包含子文件夹</label><label class="ob-field">使用此应用打开<select id="ob-app"><option>PDF Expert</option><option>预览</option><option>Typora</option><option>Visual Studio Code</option><option>文本编辑</option></select></label><p class="ob-hint">草案使用示例选项，正式界面使用系统选择面板。</p><div class="ob-actions"><button id="ob-cancel">取消</button><button class="ob-primary" id="ob-save">保存规则</button></div></section></div>
 </div>
</div>
<script>
(()=>{
 const root=document.getElementById('openby-concept');
 const get=id=>root.querySelector('#'+id);
 const data={pdf:{title:'PDF 文档',ext:'.pdf',fallback:'预览',enabled:true,rules:[{folder:'Papers',app:'PDF Expert',desc:true},{folder:'Work',app:'预览',desc:true}]},md:{title:'Markdown',ext:'.md',fallback:'Typora',enabled:true,rules:[{folder:'Projects',app:'Visual Studio Code',desc:true}]},txt:{title:'文本文件',ext:'.txt',fallback:'文本编辑',enabled:false,rules:[]}};
 let type='pdf',editing=-1,lastTrigger=null;
 const icons=()=>{if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}})};
 function render(){const d=data[type];get('ob-title').textContent=d.title;get('ob-extension').textContent=d.ext;get('ob-status').textContent=d.enabled?'● 已启用':'尚未启用';get('ob-status').className=d.enabled?'ob-green':'ob-hint';get('ob-enable').hidden=d.enabled;get('ob-fallback').textContent=d.fallback;get('ob-add').classList.toggle('ob-primary',d.enabled);get('ob-enable').className='ob-primary';get('ob-rules').innerHTML=d.rules.length?d.rules.map((r,i)=>`<div class="ob-rule"><span class="ob-number">${i+1}</span><div><div class="ob-folder"><i data-lucide="folder" aria-hidden="true"></i><strong>${r.folder}</strong></div><small class="ob-path">~/${r.folder} · ${r.desc?'包含子文件夹':'仅当前文件夹'}</small></div><span class="ob-arrow ob-number">→</span><span class="ob-app"><i data-lucide="app-window" aria-hidden="true"></i>${r.app}</span><button class="ob-quiet" data-edit="${i}" aria-label="编辑 ${r.folder} 规则">编辑</button></div>`).join(''):'<div class="ob-empty">还没有位置规则<small>所有文件将使用下方应用打开</small></div>';root.querySelectorAll('[data-type]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.type===type));const item=data[b.dataset.type];b.querySelector('small').textContent=`${item.rules.length} 条规则 · ${item.enabled?'已启用':'尚未启用'}`});icons()}
 function editor(index,trigger){editing=index;lastTrigger=trigger;const r=data[type].rules[index];get('ob-sheet-title').textContent=r?'编辑位置规则':'添加位置规则';get('ob-folder').value=r?r.folder:'Downloads';get('ob-app').value=r?r.app:data[type].fallback;get('ob-descendants').checked=r?r.desc:true;get('ob-overlay').hidden=false;get('ob-folder').focus()}
 function close(){get('ob-overlay').hidden=true;if(lastTrigger&&lastTrigger.isConnected)lastTrigger.focus();else get('ob-add').focus()}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.type){type=b.dataset.type;get('ob-result').textContent='';render()}if(b.dataset.edit!==undefined)editor(Number(b.dataset.edit),b);if(b.dataset.info)get('ob-result').textContent=b.dataset.info});
 get('ob-add').onclick=e=>editor(-1,e.currentTarget);
 get('ob-cancel').onclick=close;
 get('ob-save').onclick=()=>{const r={folder:get('ob-folder').value,app:get('ob-app').value,desc:get('ob-descendants').checked};if(editing<0)data[type].rules.push(r);else data[type].rules[editing]=r;close();render();get('ob-add').focus();get('ob-result').textContent='草案中的规则已更新。'};
 get('ob-enable').onclick=()=>{data[type].enabled=true;render();get('ob-result').textContent='草案演示：已启用。实际界面将在系统确认并验证成功后更新状态。'};
 get('ob-test').onclick=()=>{const d=data[type],r=d.rules[0];get('ob-result').innerHTML=`<strong>示例${d.ext} → ${r?r.app:d.fallback}</strong><small>${r?'命中第 1 条规则 · '+r.folder+(r.desc?'（包含子文件夹）':'（仅当前文件夹）'):'没有匹配规则，使用其他位置的应用'}${d.enabled?'':' · 配置预览，自动打开尚未启用'}</small>`};
 root.addEventListener('keydown',e=>{if(get('ob-overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const controls=[...get('ob-overlay').querySelectorAll('select,input,button')];const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
 render();
})();
</script>
